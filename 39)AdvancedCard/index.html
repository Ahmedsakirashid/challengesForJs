<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      color: white;
    }

    .container {
      width: 900px;
      background-color: #050912;
      max-width: 95%;
      position: relative;
      padding: 20px;
      border-radius: 25px;
      overflow: hidden;
    }

    .container h1{
        text-align: center;
    }

    .control{
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 5px;
        margin-bottom: 30px;
    }

    .control input{
        width: 60%;
        padding: 0.5rem;
        font-size: 1.1rem;
        border-radius: 5px;
        border: none;
    }

    .control button{
        border-radius: 5px;
        font-size: 1rem;
        cursor: pointer;
    }

    .control button:hover{
        transform: translateY(-2px);
        transition: all 0.4s;
    }

    .addBtn{
        color: #00ff1a;
        background-color: #007e0ddb;
        border: 2px solid  #00ff1a;
    }

    .removeBtn{
        color: #ff0000;
        background-color: #7e0000bb;
        border: 2px solid  #ff0000;
    }


    .cards{
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        max-width: 600px;
        margin: auto;
        gap: 12px;
    }

    .newCard{
        background-color: #0f172a;
        display: flex;
        flex-direction: column;
        gap: 10px;
        border-radius: 5px;
        padding: 4px;
        animation: fadeIn 0.4s ease;
    }

    .newCard p{
        font-size: 1.2rem;
        font-weight: 600;
    }


    .btnControl button{
        border-radius: 5px;
        font-size: 1rem;
        cursor: pointer;
        padding: 4px 20px;
        border: none;
    }

    .btnControl{
        display: flex;
        justify-content: space-between;
        gap: 4px;
    }

    .deleteBtn{
        background:#ef4444;
        color:white;
    }

    .favoriteBtn{
        background:#f59e0b;
        color:white;
    }

    .favorite.active{
        background:#22c55e;
    }


    .total{
        text-align: center;
    }


    @keyframes fadeIn{
        from{
            opacity: 0;
            transform: translateY(10px);
        }

        to{
            opacity: 1;
            transform: translateY(0);
        }
    }

</style>
<body>
    
    <div class="container">
        <h1 >🚀 Advanced Dynamic Card Manager</h1>

        <div class="control">
            <input type="text" placeholder="Enter your items..." id="cardInput">
            <button id="addBtn" class="addBtn" onclick="addCards()">Add Card</button>
            <button id="removeBtn" class="removeBtn" onclick="clearAll()">Remove All</button>
        </div>

        <div>
            <h2 class="total">Total Cards: </h2>
        </div>



        <div class="cards" id="cards"></div>

    </div>

<script>
    const cards = document.getElementById("cards");
    const input = document.getElementById("cardInput");
    const total = document.querySelector(".total");

    let lists = [];

    function rendedCard(){
        cards.innerHTML = '';

        total.textContent = `Total Cards: ${lists.length}`;

        lists.forEach((item)=>{
            const newList = document.createElement("div");
            newList.className = "newCard";

            newList.innerHTML = `
             <p>${item.title}</p>

             <div class="btnControl">
                <button class="favoriteBtn">Favorite</button>
                <button class="deleteBtn" onclick="deleteCard(${item.id})">Delete</button>
            </div>
            `;

            cards.appendChild(newList);
        });
    }

    function deleteCard(id){
        lists = lists.filter((item)=> item.id !== id);
        rendedCard();
    }


    function addCards(){
        const title = input.value.trim();

        if (!title) {
            alert("Please enter a title");
            return;
        }

        const newCard = {
            id: lists.length + 1,
            title
        };

        lists.push(newCard);
        rendedCard();
        console.log(lists);
    }

    function clearAll(){
        if(confirm("Remove all cards?")){
            lists = [];
            rendedCard();
        }
    }



    rendedCard();
</script>
</body>
</html>
