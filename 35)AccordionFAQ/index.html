<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      padding: 40px;
      display: flex;
      justify-content: center;
      flex-direction: column;
      height: 100vh;
    }

    h1{
        color: white;
        margin-bottom: 20px;
    }

    .container{
        width: 100%;
        max-width: 700px;
    }

    .faq-item{
        background: #fff;
        margin: 10px;
        border-radius: 5px;
    }

    .faq-question{
        width: 100%;
        display: flex;
        justify-content: space-between;
        padding: 20px;
        background-color: #fff;
        cursor: pointer;
        font-size: 1.2rem;
        font-weight: 600;
        border: none;
        overflow: hidden;
        border-radius: 5px;
    }

    .icon{
      font-size:24px;
      transition:0.3s;
    }

    .faq-answer{
        max-height: 0;
        overflow: hidden;
        background:#fafafa;
        transition: max-height 0.3s ease;
    }

    .faq-answer p{
      padding:20px;
      line-height:1.6;
      color:#555;
    }

    .faq-item.active .faq-answer{
        max-height: 200px;
    }

    .faq-item.active .icon{
        transform: rotate(45deg);
    }

</style>
<body>
    <div class="container">
        <h1>FAQ Accordion</h1>

        <div class="faq-item">
            <button class="faq-question">
                What is HTML?
                <span class="icon">+</span>
            </button>
            <div class="faq-answer">
                <p>
                HTML stands for HyperText Markup Language. It is used to create the structure of websites.
                </p>
            </div>
        </div>

        <div class="faq-item">
            <button class="faq-question">
                What is CSS?
                <span class="icon">+</span>
            </button>
            <div class="faq-answer">
                <p>
                  CSS stands for Cascading Style Sheets. It is used to style and design websites.
                </p>
            </div>
        </div>

        <div class="faq-item">
            <button class="faq-question">
                What is JAVASCRIPT?
                <span class="icon">+</span>
            </button>
            <div class="faq-answer">
                <p>
                 JavaScript is a programming language used to add interactivity and dynamic features to websites.0
                </p>
            </div>
        </div>
    </div>


<script>
    const questions = document.querySelectorAll(".faq-question");

    questions.forEach((question)=>{
        question.addEventListener("click", ()=>{
            const faqItem = question.parentElement;

            faqItem.classList.toggle("active");
        })
    })
</script>
</body>
</html>
