<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: #fff;
      padding: 40px;
      display: flex;
      justify-content: center;
      flex-direction: column;
      height: 100vh;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 12px;
    } 

    .modalBtn{
        padding: 12px 40px;
        font-size: 1.3rem;
        font-weight: 600;
        border-radius: 12px;
        background-color: #004cff;
        border: none;
        color: #fff;
    }


    .modal{
        position: absolute;
        background-color:  rgb(0, 0, 0, 0.8);
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        display: none;
        transition: 0.3s;
        transform: scale(0.8);
    }

    .header{
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
    }

    .close{
        font-size: 30px;
        font-weight: 600;
        background-color: #fff;
        color: black;
        padding: 2px 60px;
        border-radius: 4px;
    }

    .modal.active{
        transform: scale(1);
    }

    .content{
        background-color: bisque;
        padding: 12px ;
        border-radius: 5px;
        color: black;
    }

    .active{
        display: flex;
    }

</style>
<body>
    <div class="container">

        <button class="modalBtn" onclick="OpenModal()">Open Modal</button>

        <div class="modal ">
            
            <div class="content">
                <span class="header">
                    <h1>HTML</h1>
                    <p class="close" onclick="CloseModal()">X</p>
                </span>


                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Consectetur rerum vero itaque?</p>
            </div>
        </div>
    </div>


<script>

    const modal = document.querySelector(".modal");

    function OpenModal(){
        modal.classList.add("active");
    }

    function CloseModal(){
        modal.classList.remove("active");
    }


</script>
</body>
</html>
