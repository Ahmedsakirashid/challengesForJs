<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      color: white;
    }

    .container {
      width: 900px;
      background-color: #050912;
      max-width: 95%;
      position: relative;
      padding: 20px;
      border-radius: 25px;
      overflow: hidden;
    }

    .container h1{
        text-align: center;
    }

    .controls{
        display: flex;
        justify-content: center;
        gap: 12px;
    }

    .controls input{
        width: 40%;
        padding: 7px;
        border-radius: 5px;
        border: 2px solid #03226b;
        background-color: #0f172a;
        color: white;
    }

    .controls select{
        background-color: #0f172a;
        color: #fff;
        padding: 4px;
        border: 2px solid #03226b;
        border-radius: 4px;
    }
    .table-wrapper{
        overflow-x:auto;
        background:#1e293b;
        border-radius:15px;
        margin-top: 50px;
    }


    table{
        width:100%;
        border-collapse:collapse;
    }

    th{
        background:#2563eb;
        padding:15px;
        cursor:pointer;
    }

    td{
        padding:15px;
        text-align:center;
        border-bottom:1px solid rgba(255,255,255,.1);
    }



</style>
<body>
    <div class="container">
        <h1>Employee Management Table</h1>

        <div class="controls">
            <input type="text" placeholder="Search employee..."
            id="search">

            <select id="departmentFilter">
                <option value="">All Departments</option>
                <option value="">Developer</option>
                <option value="">Designer</option>
                <option value="">Manager</option>
            </select>

            <select id="sortBy">
                <option value="">Sort Name</option>
                <option value="">Sort Age</option>
                <option value="">Sort Salary</option>
            </select>

            <select id="order">
                <option value="">Ascending</option>
                <option value="">Descending</option>
            </select>
        </div>



        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Departments</th>
                        <th>Salary</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>



<script>
    const employees = [
    {
        id:1,
        name:"Ahmed",
        age:24,
        department:"Developer",
        salary:1200,
        status:"Active"
    },
    {
        id:2,
        name:"Ali",
        age:30,
        department:"Manager",
        salary:2500,
        status:"Inactive"
    },
    {
        id:3,
        name:"Fatima",
        age:27,
        department:"Designer",
        salary:1800,
        status:"Active"
    },
    {
        id:4,
        name:"Mohamed",
        age:22,
        department:"Developer",
        salary:1000,
        status:"Active"
    },
    {
        id:5,
        name:"Ayan",
        age:35,
        department:"Manager",
        salary:3000,
        status:"Inactive"
    },
    {
        id:6,
        name:"Hodan",
        age:26,
        department:"Designer",
        salary:1600,
        status:"Active"
    }
    ];


    const tableBody = document.getElementById("tableBody");
    const search = document.getElementById("search");
    const departmentFilter = document.getElementById("departmentFilter");
    const sortBy = document.getElementById("sortBy");
    const order = document.getElementById("order");

    function renderTable(){
        let filtered = [...employees];

        filtered = filtered.filter(emp=>
            emp.name.toLowerCase().includes(search.value.toLowerCase())
        )

        tableBody.innerHTML = filtered.map((emp)=>
            `
                <tr>
                    <td>${emp.name}</td>
                    <td>${emp.age}</td>
                    <td>${emp.department}</td>
                    <td>${emp.salary}</td>
                </tr>
            `
        ).join("");
    };


    search.addEventListener("input", renderTable);

    renderTable();



</script>
</body>
</html>
