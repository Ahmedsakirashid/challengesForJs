<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    .container {
      /* width: 900px; */
      background-color: #050912;
      max-width: 95%;
      position: relative;
      padding: 20px;
      border-radius: 25px;
    }

    .interActive{
        background-color: #0f172a;
        padding: 15px;
        border-radius: 15px;
        color: white;
        background:linear-gradient(135deg,#1e293b,#0f172a);
        transition: all 0.3s;
    }
    
    .interActive.active{
        background:linear-gradient(135deg,#2563eb,#7c3aed);
        transition: all 0.3s;
    }

    .interActive.active p{
      color:#f8fafc;
    }

    .interActive.active::before{
      transform:scale(1.4);
      background:rgba(255,255,255,0.15);
    }


    .btns button{
        padding: 15px 20px;
        font-size: 1.3rem;
        font-weight: 600;
        border-radius: 5px;
        cursor: pointer;
    }

    .btns button:hover{
        transform: translateY(-5px);
        transition: all 0.3s;
    }

    .activeBtn{
        border: none;
    }

    .learnBtn{
        border: 2px solid white;
        background-color: transparent;
        color: white;
    }

</style>
<body>
    
    <div class="container">

        <div class="interActive">
            <h1 class="" id="hero">Build Amazing UI</h1>
            <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Aliquid beatae aut voluptas.</p>

            <div class="btns">
                <button class="activeBtn">Active Mode</button>
                <button class="learnBtn">Learn More</button>
            </div>

            <p id="current">Current State: Inactive</p>
        </div>
    </div>

<script>
    const current = document.getElementById("current");
    const activeBtn = document.querySelector(".activeBtn");
    const hero = document.getElementById("hero");
    const interActive = document.querySelector(".interActive");


    let isActive = true;

    function renderUI(){
        if(isActive){
            hero.textContent = "Build Amazing UI";
            current.textContent = "Current State: Inactive";
            interActive.classList.remove("active");
            activeBtn.textContent = "Active Mode"
        }
        else{
            hero.textContent = "Hero Activated 🚀";
            current.textContent = "Current State: Active";
            interActive.classList.add("active");
            activeBtn.textContent = "Deactivate Mode"
        }
    }

    activeBtn.addEventListener("click", ()=>{
        isActive = !isActive;
        renderUI();
    });

    renderUI();

</script>
</body>
</html>
