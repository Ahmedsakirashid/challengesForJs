<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      color: white;
    }

    .container {
      width: 900px;
      background-color: #050912;
      max-width: 95%;
      position: relative;
      padding: 20px;
      border-radius: 25px;
      overflow: hidden;
    }

    .container h1{
        text-align: center;
    }

    .controls{
        display: flex;
        justify-content: center;
        gap: 12px;
        width: 100%;
    }

    .controls input, select{
        width: 100%;
        padding: 0.4rem;
        border-radius: 8px;
        border: 2px solid #fa63ff;
        background-color: #ffffffe0;
        font-size: 1rem;
    }


    .cards{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
        gap:20px;
        margin-top: 20px;
    }

    .card{
        background:#1e293b;
        padding:20px;
        border-radius:12px;
        transition:.3s;
    }

    .address{
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .orders{
        background:#334155;
        padding:8px;
        margin:5px 0;
        border-radius:6px;
    }

    .total{
        margin-top:10px;
        color:#22c55e;
        font-weight:bold;
    }

</style>
</head>
<body>
    
    <div class="container">
        <h1>Nested Data Filter</h1>

        <div class="controls">
            <input type="text" placeholder="Search Customer" id="searchName">
            <input type="text" placeholder="Search Product" id="productFilter">
            <select id="cityFilter">
                <option value="all">All Cities</option>
            </select>
        </div>


        <div class="cards" id="cards"></div>
    </div>


<script>
    const customers = [
    {
        id:1,
        customer:{
            name:"Ahmed",
            address:{
                city:"Hargeisa",
                country:"Somalia"
            }
        },
        orders:[
            { product:"Laptop", price:800 },
            { product:"Mouse", price:20 }
        ]
    },
    {
        id:2,
        customer:{
            name:"Faarax",
            address:{
                city:"London",
                country:"UK"
            }
        },
        orders:[
            { product:"Phone", price:500 },
            { product:"Headphones", price:80 }
        ]
    },
    {
        id:3,
        customer:{
            name:"Ali",
            address:{
                city:"Dubai",
                country:"UAE"
            }
        },
        orders:[
            { product:"Keyboard", price:60 },
            { product:"Monitor", price:300 }
        ]
    },
    {
        id:4,
        customer:{
            name:"Ayan",
            address:{
                city:"Hargeisa",
                country:"Somaliland"
            }
        },
        orders:[
            { product:"Tablet", price:350 },
            { product:"Smart Watch", price:200 }
        ]
    }
    ];


    const cards = document.getElementById("cards");
    const searchName = document.getElementById("searchName");
    const productFilter = document.getElementById("productFilter");
    const cityFilter = document.getElementById("cityFilter");

    const cities = [...new Set(
        customers.map(item=> item.customer.address.city)
    )];

    cities.forEach((city)=>{
        cityFilter.innerHTML += `
            <option value="${city}">${city}</option>
        `
    })

    function renderData(data){

        cards.innerHTML = data.map(item=>{

            const total = item.orders.reduce((sum,item)=> sum + item.price, 0);

            return `
                <div class="card">
                    <h2>${item.customer.name}</h2>

                    <div class="address">
                        <strong>${item.customer.address.country}:-</strong>
                        <p>${item.customer.address.city}</p>
                    </div>
                    
                    <div class="orders">
                        ${item.orders.map((order)=>`
                        <p>${order.product} -  $${order.price}</p>
                        `).join("")}
                    </div>

                    <div>
                        <p class="total">Total: ${total}</p>
                    </div>
                </div>
            `}).join('');
    };


    function filterData(){
        const nameValue = searchName.value.toLowerCase();
        const productValue = productFilter.value.toLowerCase();
        const cityValue = cityFilter.value.toLowerCase();

        const filtered = customers.filter((item)=>{
            const nameMatch = nameValue === "" || item.customer.name.toLowerCase().includes(nameValue);
            const productMatch = productValue === "" || item.orders.some((order)=> order.product.toLowerCase().includes(productValue));
            const cityMatch = item.customer.address.city.toLowerCase().includes(cityValue);

            return (
                nameMatch && productMatch && cityMatch
            );
        });

        renderData(filtered);
    }

    searchName.addEventListener("input", filterData);
    productFilter.addEventListener("input", filterData);
    cityFilter.addEventListener("change", filterData);

    renderData(customers);



</script>
</body>
</html>
